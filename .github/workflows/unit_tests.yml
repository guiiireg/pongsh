name: unit_tests

on: [push, pull_request]

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-noble-valgrind-meson-ninja-v1

      - name: Install build tools and valgrind
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind meson ninja-build

      - name: Cache criterion build
        uses: actions/cache@v4
        with:
          path: /tmp/criterion
          key: criterion-v2.4.2

      - name: Build and install criterion
        run: |
          if [ ! -d /tmp/criterion ]; then
            git clone --depth 1 --branch v2.4.2 --recurse-submodules --shallow-submodules \
              https://github.com/Snaipe/Criterion.git /tmp/criterion
            meson setup /tmp/criterion/build /tmp/criterion
            ninja -C /tmp/criterion/build
          fi
          sudo ninja -C /tmp/criterion/build install
          sudo ldconfig

      - name: Build library and tests
        run: make tests_run

      - name: Run criterion unit tests
        run: ./tests_libmy

      - name: Run tests under valgrind
        run: |
          valgrind --leak-check=full --show-leak-kinds=definite \
            --errors-for-leak-kinds=definite --error-exitcode=1 \
            --trace-children=yes ./tests_libmy
